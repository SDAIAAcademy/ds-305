<section>
<h2>Day 1: Can the probabilities be trusted</h2>
<ol>
<li><p>Amana's card says "performance is consistent across all customer groups". The evidence file has an overall AUC and no subgroup results. You have not yet computed anything by group. What is the verdict today?</p><ul><li><b>A.</b> Supported, since no gap has been found</li><li><b>B.</b> Unsupported, since the package has no evidence for it</li><li><b>C.</b> Untestable, since groups were not measured</li><li><b>D.</b> No verdict until the subgroup tables of Lab 1.4 exist and are read</li></ul></li>
<li><p>A second team's model has AUC 0.78 on your holdout and accuracy 90% at a threshold of 0.5. Its mean predicted default probability is 0.31; the default rate is 0.09. Which result tells the committee the probabilities cannot be read as rates?</p><ul><li><b>A.</b> The AUC of 0.78, which is high for a credit model</li><li><b>B.</b> The accuracy of 90%</li><li><b>C.</b> The model's training loss, reported by the developers at the end of fitting</li><li><b>D.</b> A reliability diagram and a Brier score against the base rate</li></ul></li>
<li><p>You recommend Platt scaling for Amana. You have the 30,000 training rows, 10,000 calib rows and 10,000 holdout rows. Where do you fit the map, and where do you report its effect?</p><ul><li><b>A.</b> Fit on the calib rows, report on the holdout</li><li><b>B.</b> Fit on the training rows, report on the holdout</li><li><b>C.</b> Fit and report on the holdout</li><li><b>D.</b> Fit and report on the calib rows</li></ul></li>
<li><p>After recalibration, the Southern region shows 9.2% predicted and 9.7% observed (interval 8.2 to 11.3). The Northern region shows 8.7% predicted and 15.4% observed (interval 12.5 to 18.8). What do you report?</p><ul><li><b>A.</b> Neither: the model was recalibrated</li><li><b>B.</b> Both, as under-predicted regions</li><li><b>C.</b> The Northern gap, with its interval</li><li><b>D.</b> Neither: the Northern group is too small</li></ul></li>
<li><p>A model card reports AUC 0.86 "on 4,000 held-out rows". The metadata shows the shipped model was retrained on all rows, those 4,000 included. On your untouched holdout it scores 0.76. What is the verdict on the card's claim?</p><ul><li><b>A.</b> Supported, because the developers did hold the rows out when they measured</li><li><b>B.</b> Unsupported, because the number belongs to rows the shipped model has seen</li><li><b>C.</b> Untestable, because the 4,000 rows cannot be recovered</li><li><b>D.</b> Supported within sampling error of the holdout</li></ul></li>
<li><p>A card says the model "will remain accurate for three years". What should the validation report do with this claim?</p><ul><li><b>A.</b> Mark it supported, since the holdout AUC is high today and should hold</li><li><b>B.</b> Remove it from the card without comment, since nobody can check it</li><li><b>C.</b> Mark it untestable and rewrite it as a monitoring condition</li><li><b>D.</b> Mark it unsupported and reject the model until the developers prove it</li></ul></li>
<li><p>Two forecasters say 0.51 and 0.95 for the same applicant, who then defaults. Which score tells them apart and rewards reporting the probability you believe?</p><ul><li><b>A.</b> Accuracy at a threshold of 0.5</li><li><b>B.</b> The AUC over the whole holdout</li><li><b>C.</b> The share of applicants above 0.5</li><li><b>D.</b> The Brier score</li></ul></li>
<li><p>On a holdout with a 10% default rate, a model has AUC 0.75 and Brier 0.20. Giving everyone 10% scores Brier 0.09. What does this show?</p><ul><li><b>A.</b> Its probabilities are worse than a constant, though it ranks well</li><li><b>B.</b> The base-rate forecast is the better model and should replace it in production</li><li><b>C.</b> The Brier score is unreliable when the AUC of a model is this high</li><li><b>D.</b> The holdout is too small to compare the two forecasts fairly</li></ul></li>
<li><p>Every bin of a reliability diagram lies well below the diagonal, by roughly the same factor in odds. The metadata says the training set was rebalanced to 50/50. What is the most likely cause?</p><ul><li><b>A.</b> The model overfitted its training rows and lost its calibration there</li><li><b>B.</b> The model learned odds for a population where half default</li><li><b>C.</b> The holdout has more defaults than the training data had</li><li><b>D.</b> Too few bins were used to draw the diagram</li></ul></li>
<li><p>You fit isotonic regression on the holdout and report its calibration error on the same holdout: 0.002. Fitted on calib rows instead, the holdout error is 0.012. Which number goes in the report?</p><ul><li><b>A.</b> 0.002, because it uses the larger, cleaner set of rows for both steps</li><li><b>B.</b> The average of the two, to balance the two estimates</li><li><b>C.</b> 0.012, because the map has not seen the rows it is judged on</li><li><b>D.</b> Neither: isotonic regression cannot be evaluated</li></ul></li>
<li><p>After Platt scaling, the Brier score drops from 0.199 to 0.081. What happens to the AUC?</p><ul><li><b>A.</b> It rises, because the probabilities are now right</li><li><b>B.</b> It falls, because the scores were compressed</li><li><b>C.</b> It must be recomputed on new training rows</li><li><b>D.</b> It stays exactly the same</li></ul></li>
<li><p>After recalibration a group of 300 applicants shows 9% predicted and 11% observed, with a 95% interval of 7.9% to 15.0% for the observed rate. What do you write?</p><ul><li><b>A.</b> A finding: the group is under-predicted by 2 points</li><li><b>B.</b> No finding: the prediction lies inside the interval</li><li><b>C.</b> Recalibrate again on this group of 300 applicants only</li><li><b>D.</b> A finding, because small groups always hide gaps larger than they show</li></ul></li>
<li><p>A credit model excludes age band on purpose. After recalibration, applicants aged 18 to 24 default 5 points more often than predicted, outside the interval. Why did the recalibration not fix it?</p><ul><li><b>A.</b> The map sees only the score, which does not carry age</li><li><b>B.</b> The map was fitted on too few rows to reach the young band</li><li><b>C.</b> Age band should have been kept in the holdout as well</li><li><b>D.</b> Isotonic regression, being more flexible, would have fixed it</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Intervals with guarantees</h2>
<ol>
<li><p>Platt scaling was fitted on the calib rows. On the holdout, the Brier score fell from 0.199 to 0.081 and the mean prediction is 9.0% against 9.9% observed. Which statement holds?</p><ul><li><b>A.</b> The AUC rose with the Brier score</li><li><b>B.</b> Every region is now calibrated, since the map was fitted on all of them</li><li><b>C.</b> The ranking is unchanged and the average is repaired</li><li><b>D.</b> The developers' model was retrained</li></ul></li>
<li><p>Split conformal on 895 calib defaults gives Amana's loss model intervals of plus or minus 8,134 riyals. A provisioning analyst asks what the "90%" means. What do you tell her?</p><ul><li><b>A.</b> Each loan has a 90% chance of a loss inside its own interval</li><li><b>B.</b> Nine in ten losses fall inside, whoever applies to Mizan next year</li><li><b>C.</b> The loss model is now 90% accurate</li><li><b>D.</b> Over new loans like the calib loans, at least 90% fall inside</li></ul></li>
<li><p>An applicant's 90% APS set is {A}. The officer asks whether the model is certain this applicant will repay on time. What is the right answer?</p><ul><li><b>A.</b> No: across applicants, about one in ten sets misses the true grade</li><li><b>B.</b> Yes: only one grade could be the true one</li><li><b>C.</b> Yes, with exactly 90% probability for this applicant</li><li><b>D.</b> No: a set of one means the model failed to find enough grades to include</li></ul></li>
<li><p>Split conformal with one threshold reaches 91% coverage overall on Amana's loss intervals, 77% on large loans and 100% on medium and small loans. What explains it?</p><ul><li><b>A.</b> The conformal threshold was computed wrongly</li><li><b>B.</b> Losses on large loans vary more, and one width averages over groups</li><li><b>C.</b> Large loans are too rare in the calib rows</li><li><b>D.</b> The loss model under-predicts large losses, so their intervals sit too low</li></ul></li>
<li><p>Under the same income shift, loss interval coverage falls from 91% to 77% while grade set coverage falls from 89% to 88%. Which explanation is right?</p><ul><li><b>A.</b> Prediction sets keep their guarantee under shift; intervals for amounts do not</li><li><b>B.</b> The grade model was calibrated on more rows</li><li><b>C.</b> Loss errors grow with income through loan size; grade errors barely do</li><li><b>D.</b> Richer applicants default less, so the sets are easier</li></ul></li>
<li><p>You have 99 calibration scores and want 90% intervals. Which sorted score is the split conformal threshold?</p><ul><li><b>A.</b> The 89th smallest</li><li><b>B.</b> The 90th smallest</li><li><b>C.</b> The 99th smallest, to be safe</li><li><b>D.</b> The mean plus 1.645 standard deviations</li></ul></li>
<li><p>Which situation breaks the assumption that split conformal coverage rests on?</p><ul><li><b>A.</b> The loss model is a boosted tree rather than a linear model</li><li><b>B.</b> The errors are skewed rather than normal</li><li><b>C.</b> Calib rows from 2023, new loans from a year a new product launched</li><li><b>D.</b> The calibration set has 900 rows rather than the 9,000 that were planned</li></ul></li>
<li><p>On the same holdout, LAC sets cover 89% with mean size 1.56 and APS sets cover 90% with mean size 1.67. Which statement is right?</p><ul><li><b>A.</b> APS is worse because its sets are larger on average</li><li><b>B.</b> LAC is invalid because it is below 90%</li><li><b>C.</b> Both keep the marginal guarantee; they differ in where larger sets go</li><li><b>D.</b> APS guarantees 90% coverage within each grade, while LAC only overall</li></ul></li>
<li><p>Prediction sets for three grades cover 90% of applicants but the true grade of only 44% of defaulters. The committee cares most about defaulters. What do you recommend?</p><ul><li><b>A.</b> Raise the target to 99% for everyone</li><li><b>B.</b> Report the 90% as it stands and note that it holds on average over all grades</li><li><b>C.</b> A threshold per true grade, from the calib rows of that grade</li><li><b>D.</b> Drop the sets and use the top grade</li></ul></li>
<li><p>One threshold per loan-size band lifts large-loan coverage from 77% to 91%. Overall coverage stays at 91%. What did the repair cost?</p><ul><li><b>A.</b> Nothing: coverage rose for large loans and fell for no other group</li><li><b>B.</b> Wider large-loan intervals; lower, near-target coverage for the rest</li><li><b>C.</b> A retrained loss model</li><li><b>D.</b> The marginal guarantee, which no longer holds once groups are split</li></ul></li>
<li><p>You want a 90% threshold for a group with 6 calibration defaults. What does split conformal give?</p><ul><li><b>A.</b> A threshold from the 6th score, the largest one available</li><li><b>B.</b> An infinite interval, because 90% needs a 7th score</li><li><b>C.</b> The overall threshold, automatically</li><li><b>D.</b> A narrower interval than for large groups</li></ul></li>
<li><p>After applicants shift towards higher incomes, loss interval coverage falls from 91% to 77%, and the interval width barely changes. Why did the width not warn anyone?</p><ul><li><b>A.</b> The threshold comes from the calib rows, not the new population</li><li><b>B.</b> The shift was too small to matter</li><li><b>C.</b> Conformal intervals always widen under shift, so they did warn</li><li><b>D.</b> The loss model was retrained on the shifted data and hid the change</li></ul></li>
<li><p>Losses are known months after a default. Which monitoring rule gives the earliest warning that the loss intervals are losing coverage?</p><ul><li><b>A.</b> Monthly coverage of the intervals on new defaults, against the 90% target</li><li><b>B.</b> The share of new loans above 25,000 riyals, against the holdout share</li><li><b>C.</b> The AUC of the default model</li><li><b>D.</b> The mean predicted loss</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: What drives the predictions</h2>
<ol>
<li><p>Split conformal intervals for Amana's loss model cover 91% of holdout defaults, 77% of large loans, and 77% of all defaults after a strong simulated income shift. Which sentence can go in the report?</p><ul><li><b>A.</b> Every loan's interval holds 90% of the time</li><li><b>B.</b> Coverage holds overall, not for large loans or a richer population</li><li><b>C.</b> The loss model must be retrained before any of its intervals can be used</li><li><b>D.</b> Under a shift the intervals widen to keep 90%</li></ul></li>
<li><p>Shuffled alone, bank inflow raises the log loss by 0.068 and declared income by 0.046. Shuffled together, by 0.034. The two correlate at 0.84. Which reading is right?</p><ul><li><b>A.</b> Bank inflow is the more important of the two</li><li><b>B.</b> Income accounts for 0.114 of the log loss</li><li><b>C.</b> Income matters; the single numbers measure reactions to impossible pairs</li><li><b>D.</b> Together they matter little, so income can be dropped from the next version</li></ul></li>
<li><p>PD for declared income rises 1.6 times as much as ALE between 9,000 and 19,000 riyals. Declared income and bank inflow correlate at 0.84, and overstating income is a risk signal in the model. What explains the gap?</p><ul><li><b>A.</b> PD pairs high declared incomes with inflows real applicants do not have</li><li><b>B.</b> ALE uses too few applicants in each bin, so its curve is flattened by noise</li><li><b>C.</b> The model overreacts to declared income</li><li><b>D.</b> PD is not centred and ALE is</li></ul></li>
<li><p>For every applicant, the base value plus the Shapley values of the ten features equals the model's raw score exactly. A colleague says this proves the reasons shown to officers are reliable. What do you answer?</p><ul><li><b>A.</b> Yes: an exact decomposition cannot change</li><li><b>B.</b> Complete accounting for this model, not survival across a refit</li><li><b>C.</b> Yes: each value is the feature's causal effect</li><li><b>D.</b> No: Shapley values stop adding up once two features are strongly correlated</li></ul></li>
<li><p>Wallet months correlates with age band at -0.44, is a top reason for 47% of applicants over 55 against 21% under 25, and narrows the age gap. What can you conclude?</p><ul><li><b>A.</b> Wallet history causes default, so the feature is legitimate to use</li><li><b>B.</b> The correlation is too weak to matter</li><li><b>C.</b> Age is not in the model, so there is no age effect</li><li><b>D.</b> It carries age information and would deliver age-linked reasons</li></ul></li>
<li><p>Why is permutation importance for a validation report computed on the holdout rather than on the training rows?</p><ul><li><b>A.</b> The holdout is larger, so its importances are less noisy</li><li><b>B.</b> On training rows, overfitted features look more important than they are</li><li><b>C.</b> Permutation importance cannot be computed on the rows a model was trained on</li><li><b>D.</b> The holdout has no correlated features</li></ul></li>
<li><p>Two features correlate at 0.9. Shuffled alone, each shows a large importance; shuffled together, their joint importance is smaller than either. What should the report say?</p><ul><li><b>A.</b> Report both single numbers and rank the two features by them</li><li><b>B.</b> Drop the feature with the smaller number</li><li><b>C.</b> One grouped importance for the pair, with no ranking within it</li><li><b>D.</b> Add the two single numbers to get the importance of the pair</li></ul></li>
<li><p>For a feature strongly correlated with another, partial dependence and accumulated local effects disagree at the ends of the range. Which one describes the model on realistic applicants?</p><ul><li><b>A.</b> Partial dependence, because it uses every applicant at every value of the grid</li><li><b>B.</b> Accumulated local effects, which move each applicant within their bin</li><li><b>C.</b> Neither: effect plots are invalid with correlated features</li><li><b>D.</b> Both equally: they answer the same question</li></ul></li>
<li><p>At the top of the grid, 53% of the rows behind a partial dependence point pair a high declared income with a bank inflow no real applicant has. What do you do with this number?</p><ul><li><b>A.</b> Remove those rows and redraw partial dependence from the rest</li><li><b>B.</b> Report it under the plot as the share of rows outside the data</li><li><b>C.</b> Ignore it: the model still produces a prediction for those rows</li><li><b>D.</b> Use it to rescale the curve by 0.47</li></ul></li>
<li><p>Shapley values of a tree model add up exactly to each prediction. Which statement follows?</p><ul><li><b>A.</b> It accounts completely for this model's prediction</li><li><b>B.</b> The explanation is the same for any refit of the model</li><li><b>C.</b> Each value is the causal effect of its feature on default</li><li><b>D.</b> Correlated features get equal shares</li></ul></li>
<li><p>An applicant's top reason is bank inflow in three of five equally valid refits and declared income in two. What should the officer be shown?</p><ul><li><b>A.</b> Bank inflow, the majority reason in three of the five refits</li><li><b>B.</b> Declared income, the reason in the shipped model</li><li><b>C.</b> Both incomes as one reason, income, or no single main reason</li><li><b>D.</b> All ten features with their values</li></ul></li>
<li><p>A proposed feature raises AUC by 0.004, correlates with age band at -0.44, and becomes a top reason for 47% of applicants over 55 against 21% of those under 25. Age is excluded from the model. What do you recommend?</p><ul><li><b>A.</b> Accept it: the model still uses no age column, so claim 3 stays true</li><li><b>B.</b> Accept it and show it as a reason, since it is not age</li><li><b>C.</b> Reject the whole model</li><li><b>D.</b> Do not add it for 0.004; if added, never show it as a reason</li></ul></li>
<li><p>Adding a feature narrows the calibration gap of the oldest age band from 1.2 to 0.8 points. What does this suggest?</p><ul><li><b>A.</b> The feature carries some of the age information the model lacked</li><li><b>B.</b> The feature fixes an age bias and should be kept for that reason</li><li><b>C.</b> The gap was noise all along</li><li><b>D.</b> Calibration by age is unaffected by the features a model uses</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: Validate and decide</h2>
<ol>
<li><p>Over five refits, 8 of 10 applicants keep their top reason and 1 of 10 keeps all three. Bank inflow and declared income correlate at 0.84. Which sentence is supported?</p><ul><li><b>A.</b> Show officers one grouped income reason, and only reasons that survive refits</li><li><b>B.</b> The three reasons are exact, so they can be shown as they are</li><li><b>C.</b> Bank inflow is a stronger reason than declared income</li><li><b>D.</b> The model must be retrained until all three reasons are stable across refits</li></ul></li>
<li><p>After recalibration, men default at 10.5% against 8.9% predicted, interval 9.6 to 11.4; women at 9.5% against 9.1%. Under the course rules, what goes in the report?</p><ul><li><b>A.</b> Nothing: the gap is within noise</li><li><b>B.</b> A high finding of gender bias, since gender is a protected attribute</li><li><b>C.</b> Evidence that the model discriminates against men</li><li><b>D.</b> A medium finding: supported, 1.6 points, monitored by gender</li></ul></li>
<li><p>The feed broke on 1 March 2025. Outcomes of March applications mature in March 2026. Which monitor raises the alarm in March 2025?</p><ul><li><b>A.</b> Input range checks and top-reason shares, on the day of scoring</li><li><b>B.</b> Monthly AUC on scored applications, against the holdout AUC of 0.755</li><li><b>C.</b> Loss interval coverage on defaulted loans</li><li><b>D.</b> Retraining every quarter on recent applications</li></ul></li>
<li><p>metadata.json says officers see the three largest Shapley values. evidence.json says stability_checked: false. You tested stability yourself on Day 3. What is O5?</p><ul><li><b>A.</b> Present, because the stability panel from Day 3 now exists</li><li><b>B.</b> Missing, because nothing about explanations is there</li><li><b>C.</b> Partial: the method is stated, its stability is not checked by the developers</li><li><b>D.</b> Not applicable, because the reasons were unstable</li></ul></li>
<li><p>Four drafts for the approval committee. Which one could an auditor check next year?</p><ul><li><b>A.</b> Borderline applications receive careful human review by experienced officers in every branch</li><li><b>B.</b> Model risk checks calibration by region and age monthly; two breaches mean revalidation</li><li><b>C.</b> The model will be monitored for fairness</li><li><b>D.</b> The developers retrain the model every year</li></ul></li>
<li><p>A region of 508 applicants is predicted to default at 8.7% and defaults at 15.4%, with a 95% interval of 12.5% to 18.8%. A second region of 1,951 is predicted 9.2% and defaults at 9.0% (7.8% to 10.4%). Which gaps does the report flag?</p><ul><li><b>A.</b> The first only: its prediction lies outside the observed interval</li><li><b>B.</b> Both: every difference between predicted and observed is a gap</li><li><b>C.</b> Neither: 508 applicants are too few for any finding</li><li><b>D.</b> The second only: it is the larger group</li></ul></li>
<li><p>Within one region, applicants aged 18 to 24 default at 39% on 18 defaults, interval 26% to 54%, against 12.7% predicted. Other age bands in the region rest on 6 to 30 defaults. How should the report treat the crossed table?</p><ul><li><b>A.</b> Rate every cell outside its interval as a high finding for the committee</li><li><b>B.</b> Drop it: crossed groups are never reported</li><li><b>C.</b> Average the cells to get one regional gap</li><li><b>D.</b> Give counts and intervals; name the young cell one to monitor</li></ul></li>
<li><p>A model's AUC falls from 0.755 to 0.677 on a later batch. By month and channel, one channel is unharmed throughout; the other predicts 46% against 10% observed from one month onwards. What does the pattern point to?</p><ul><li><b>A.</b> A change in a process feeding that channel from that month</li><li><b>B.</b> A gradual change in borrowers' behaviour across the market</li><li><b>C.</b> Overfitting that has finally shown itself</li><li><b>D.</b> Too few defaults to tell</li></ul></li>
<li><p>In the failing slice, the population stability index of bank inflow is 8.3 and of every other feature below 0.04. The median bank inflow is 8,240 SAR in February and 8.14 in March. What is the most likely cause?</p><ul><li><b>A.</b> Applicants' bank inflows fell sharply in March across the channel</li><li><b>B.</b> The model needs more trees to handle the new values</li><li><b>C.</b> Declared incomes rose, which moved the model</li><li><b>D.</b> The feed began reporting bank inflow in thousands</li></ul></li>
<li><p>Outcomes take twelve months to mature. Which measure, computed on the day of scoring, would have warned of a broken input in its first week?</p><ul><li><b>A.</b> The share of applicants whose top reason is each feature</li><li><b>B.</b> Monthly AUC of scored applications, against the holdout AUC of 0.755</li><li><b>C.</b> Calibration by region on matured loans</li><li><b>D.</b> The default rate of the portfolio</li></ul></li>
<li><p>The cause of a decline is a unit change in one channel's bank inflow feed. A manager proposes retraining on the last six months. What is wrong with the proposal?</p><ul><li><b>A.</b> Six months is too little data to retrain a credit model of this size</li><li><b>B.</b> Retraining needs the developers, not the validator</li><li><b>C.</b> Nothing: retraining fixes any decline</li><li><b>D.</b> It would learn the broken unit; fix the feed and rescore instead</li></ul></li>
<li><p>A package's evidence file reports AUC 0.864, measured on rows the shipped model was trained on. How is the checklist item "discrimination is measured on rows the shipped model never saw" scored?</p><ul><li><b>A.</b> Partial: a measurement exists but answers a different question</li><li><b>B.</b> Present: the evidence file has an AUC, which is what the item asks for</li><li><b>C.</b> Missing: the number is wrong</li><li><b>D.</b> Not applicable to a credit model</li></ul></li>
<li><p>You computed calibration and subgroup tables yourself during validation. The package contains neither. How do they appear in the report?</p><ul><li><b>A.</b> As present, since the evidence now exists in the validation</li><li><b>B.</b> They are left out, since the developers did not supply them</li><li><b>C.</b> As the developers' results, to keep the report short</li><li><b>D.</b> As missing from the package, with the validator's results labelled</li></ul></li>
<li><p>A package scores: soundness 2 present and 3 partial; outcomes 2 partial and 3 missing; monitoring 2 missing. Which gap prevents a "fit with conditions" decision from being enforced?</p><ul><li><b>A.</b> No owner, inputs, outcomes or thresholds to monitor</li><li><b>B.</b> The missing library versions, so no exact refit is possible</li><li><b>C.</b> The missing subgroup results</li><li><b>D.</b> The partial statement of intended use</li></ul></li>
<li><p>Which draft condition could an auditor check a year later?</p><ul><li><b>A.</b> High-risk applications receive careful review by experienced officers in every branch</li><li><b>B.</b> The model is monitored for bias</li><li><b>C.</b> The developers retrain the model every year on all new data</li><li><b>D.</b> Model risk checks calibration by region and age monthly; two breaches mean revalidation</li></ul></li>
<li><p>Which human-review rule guards best against officers simply accepting the score?</p><ul><li><b>A.</b> Named groups and full grade sets, with stable reasons and power to differ</li><li><b>B.</b> Officers review borderline scores</li><li><b>C.</b> Officers sign every decision the model makes, so none is fully automatic</li><li><b>D.</b> Officers review a random 5% of applications, chosen fresh each month</li></ul></li>
<li><p>A model ranks well and its probabilities can be repaired, but it has two high calibration gaps by group and a broken input feed. No team agrees to own monitoring. What should the validator recommend?</p><ul><li><b>A.</b> Fit, because the model ranks well</li><li><b>B.</b> Fit with conditions, leaving the owner of monitoring to be decided later</li><li><b>C.</b> Fit with conditions, owned by the validator</li><li><b>D.</b> Not fit, stating what would change the decision</li></ul></li>
</ol>
